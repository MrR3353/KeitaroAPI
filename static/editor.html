<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Keitaro Campaign</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin: 0; }
  a { color: #2563eb; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 28px; }
  button { padding: 8px 12px; font-size: 13px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  button.secondary { background: #6b7280; }
  button.danger { background: #dc2626; }
  button.success { background: #16a34a; }
  button:disabled, button.secondary:disabled, button.danger:disabled, button.success:disabled {
    background: #d1d5db; color: #6b7280; cursor: not-allowed;
  }
  #result { white-space: pre-wrap; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  #result.error { background: #fee2e2; color: #991b1b; }
  #result.success { background: #dcfce7; color: #166534; }
  .stream-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  .stream-card-dirty { border-color: #f59e0b; }
  .dirty-badge { background: #fef3c7; color: #92400e; }
  .stream-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .stream-meta { color: #6b7280; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  th { color: #555; }
  tr.status-active { background: #ffffff; }
  tr.status-pending_add { background: #fef9c3; }
  tr.status-pending_remove, tr.status-removed { background: #e5e7eb; color: #6b7280; }
  .pin-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 2px 6px; }
  .pin-btn.pinned { filter: none; }
  .pin-btn:not(.pinned) { filter: grayscale(1); opacity: 0.5; }
  .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #f3f4f6; }
  .add-offer-row { display: flex; gap: 8px; align-items: flex-start; }
  .add-offer-row input { padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; width: 320px; }
  .offer-search-wrap { position: relative; display: inline-block; }
  .offer-suggestions { position: absolute; top: calc(100% + 4px); left: 0; width: 100%; background: white; border: 1px solid #ccc; border-radius: 6px; max-height: 220px; overflow-y: auto; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .offer-suggestions div { padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .offer-suggestions div:hover { background: #f3f4f6; }
</style>
</head>
<body>

<div class="top-bar">
  <h1 id="campaign-title">Campaign</h1>
  <a href="index.html">&larr; Back to list</a>
</div>

<div class="toolbar">
  <button id="fetch-streams-btn">Fetch streams from KT</button>
  <button id="push-all-btn" class="success">Push to KT</button>
</div>

<div id="result" style="display:none; margin-bottom: 28px;"></div>

<div id="streams"></div>

<script src="offer-search.js"></script>
<script src="editor.js"></script>
</body>
</html>
